name: Feather Quantizer - firmware build

on:
  push:
    branches: [feather-main]
    paths:
      - 'keyboards/feather_quantizer/**'
      - 'docs/feather-quantizer/**'
      - 'prompts/**'
      - 'scripts/feather-quantizer/**'
      - '.github/workflows/feather-build.yml'
  pull_request:
    branches: [feather-main]
    paths:
      - 'keyboards/feather_quantizer/**'
      - 'docs/feather-quantizer/**'
      - 'prompts/**'
      - 'scripts/feather-quantizer/**'
      - '.github/workflows/feather-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline-kqm:
    runs-on: ubuntu-latest
    container: ghcr.io/qmk/qmk_cli:latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install repository Python requirements
        run: /opt/uv/tools/qmk/bin/python3 -m pip install -r requirements.txt

      - name: Show toolchain and pinned baseline
        run: |
          qmk --version || true
          arm-none-eabi-gcc --version | head -n 1 || true
          git show --no-patch --oneline 4de02c1aeec5a34f0744a97213499441c508d565
          git submodule status

      - name: Build upstream KQM Mini baseline
        run: bash scripts/feather-quantizer/build-kqm-baseline.sh

      - name: Upload KQM baseline UF2
        uses: actions/upload-artifact@v4
        with:
          name: kqm-mini-baseline-uf2
          path: '*.uf2'
          if-no-files-found: error

  feather-target:
    runs-on: ubuntu-latest
    container: ghcr.io/qmk/qmk_cli:latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install repository Python requirements
        run: /opt/uv/tools/qmk/bin/python3 -m pip install -r requirements.txt

      - name: Build Feather target when implementation exists
        shell: bash
        run: |
          if [[ -f keyboards/feather_quantizer/rules.mk || -f keyboards/feather_quantizer/info.json ]]; then
            make feather_quantizer:vial:uf2
          else
            echo 'Feather target is not implemented yet; skipping target build.'
          fi

      - name: Upload Feather UF2 when present
        uses: actions/upload-artifact@v4
        with:
          name: feather-quantizer-uf2
          path: '*feather_quantizer*.uf2'
          if-no-files-found: ignore
